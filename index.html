<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FlightPulse PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563EB">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        input { user-select: auto; }
        .fade-in { opacity: 0; animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .pb-safe { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
        .loader { width: 24px; height: 24px; border: 3px solid #e2e8f0; border-top-color: #2563EB; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 pb-24 text-slate-900 font-sans">

    <!-- Header -->
    <div class="bg-gradient-to-br from-blue-700 via-blue-600 to-blue-800 rounded-b-[40px] pb-32 pt-12 px-6 text-white shadow-lg relative z-0">
        <div class="flex justify-between items-center max-w-md mx-auto mb-6">
            <h1 class="text-xl font-extrabold tracking-widest">FLIGHT<span class="text-orange-400">PULSE</span></h1>
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-md">
                <span class="text-lg">✈️</span>
            </div>
        </div>
        <div class="max-w-md mx-auto">
            <p class="text-blue-200 text-xs font-bold uppercase tracking-widest mb-2" id="greetingMsg">Ready to fly</p>
            <h2 class="text-3xl font-bold leading-tight">Where are we<br>heading today?</h2>
        </div>
    </div>

    <main id="app" class="p-4 max-w-md mx-auto -mt-20 relative z-10">
        
        <!-- SEARCH VIEW -->
        <div id="view-search" class="fade-in">
            <div class="bg-white rounded-[32px] shadow-xl p-6 mb-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-gray-800 text-sm font-extrabold uppercase tracking-wider">Flight Search</h2>
                    <span class="bg-blue-50 text-blue-600 text-[10px] font-bold px-3 py-1.5 rounded-full">ONE WAY</span>
                </div>
                <div class="relative mb-4">
                    <div class="absolute left-4 top-4 text-gray-400 text-lg">🛫</div>
                    <input type="text" id="fromInput" placeholder="From (e.g. KTM, JFK)" class="w-full p-4 pl-12 border-2 border-gray-100 rounded-2xl bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition-all font-bold text-gray-700 text-lg uppercase">
                </div>
                <div class="relative mb-6">
                    <div class="absolute left-4 top-4 text-gray-400 text-lg">🛬</div>
                    <input type="text" id="destInput" placeholder="To (e.g. DXB, LHR)" class="w-full p-4 pl-12 border-2 border-gray-100 rounded-2xl bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition-all font-bold text-gray-700 text-lg uppercase">
                </div>
                <button onclick="searchFlight()" class="w-full bg-blue-600 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-blue-600/30 active:scale-95 transition-all">Search Flights</button>
            </div>

            <div id="layoverInfo" class="hidden bg-orange-50 border-2 border-orange-100 p-5 rounded-[24px] mb-6">
                <h3 class="font-bold text-orange-800 flex items-center gap-2 mb-2 text-lg">💡 Layover Insight</h3>
                <p id="infoText" class="text-sm text-orange-700 font-medium"></p>
            </div>

            <div id="flightResults" class="space-y-4"></div>

            <div id="trendingSection" class="mt-2 mb-8">
                <h3 class="font-bold text-gray-800 mb-4 px-2 text-lg">🔥 Popular Routes</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100" onclick="fillSearch('KTM', 'DXB')">
                        <div class="text-2xl mb-2">🏙️</div>
                        <p class="font-bold text-gray-800">KTM → DXB</p>
                        <p class="text-xs text-gray-400 font-bold mt-1">From $290</p>
                    </div>
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100" onclick="fillSearch('DXB', 'SIN')">
                        <div class="text-2xl mb-2">🦁</div>
                        <p class="font-bold text-gray-800">DXB → SIN</p>
                        <p class="text-xs text-gray-400 font-bold mt-1">From $350</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- TRACKER VIEW -->
        <div id="view-tracker" class="fade-in hidden">
            <div class="bg-white rounded-[32px] shadow-xl p-6 text-center">
                <div class="text-6xl mb-4">📡</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Live Radar</h2>
                <p class="text-gray-500 mb-6 font-medium">Track any flight in real-time.</p>
                <input type="text" id="flightNoInput" placeholder="Flight No (e.g. QR645, AA100)" class="w-full p-4 border-2 border-gray-100 rounded-2xl bg-gray-50 mb-4 text-center font-bold text-xl uppercase">
                <button onclick="trackFlight(this)" class="w-full bg-blue-600 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-blue-600/30 active:scale-95 transition-all">Locate Flight</button>
                <div id="trackerResult" class="mt-6"></div>
            </div>
        </div>

        <!-- LAYOVER VIEW -->
        <div id="view-layovers" class="fade-in hidden">
            <div class="bg-white rounded-[32px] shadow-xl p-6 text-center">
                <div class="text-6xl mb-4">☕</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Airport Intel</h2>
                <p class="text-gray-500 mb-6 font-medium">Security waits, lounges & tips.</p>
                <input type="text" id="airportInput" placeholder="Airport Code (e.g. DXB, LHR)" class="w-full p-4 border-2 border-gray-100 rounded-2xl bg-gray-50 mb-4 text-center font-bold text-xl uppercase">
                <button onclick="getLayoverIntel(this)" class="w-full bg-orange-500 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-orange-500/30 active:scale-95 transition-all">Get Intel</button>
                <div id="layoverResult" class="mt-6"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 pb-safe z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] rounded-t-2xl">
        <button onclick="switchTab('view-search', this)" class="nav-btn flex flex-col items-center text-blue-600">
            <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
            <span class="text-[10px] font-bold">Search</span>
        </button>
        <button onclick="switchTab('view-tracker', this)" class="nav-btn flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            <span class="text-[10px] font-bold">Tracker</span>
        </button>
        <button onclick="switchTab('view-layovers', this)" class="nav-btn flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="text-[10px] font-bold">Layovers</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
